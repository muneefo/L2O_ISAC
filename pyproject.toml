[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "l2o-isac"
version = "0.1.0"
description = "Independent implementation of L2O Robust Hybrid Beamforming for ISAC"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
l2o-isac = "l2o_isac.experiment:main"

[tool.setuptools.packages.find]
include = ["l2o_isac*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
